<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3ead8">
<title>うーちーの季節</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=Klee+One:wght@400;600&display=swap">
<style>
/* layout: full-bleed game screen, 240-line internal render upscaled with smoothing; soft rounded UI floats over it */
:root{
  --ink:#fdf8f0; --ink-dim:rgba(253,248,240,.72); --shade:rgba(24,20,28,.55);
  --bg:#141218; --accent:#f6c4d2; --chip:rgba(255,255,255,.14);
  --ui:"Kiwi Maru","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
#stage{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--ui)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
#fade{position:absolute;inset:0;background:#000;opacity:1;transition:opacity .6s ease;pointer-events:none}
.hud{display:flex;gap:8px;align-items:center}
#top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#auto[aria-pressed="true"]{background:rgba(246,196,210,.45);border-color:rgba(255,255,255,.55)}
#season{font-size:22px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.45);letter-spacing:.08em}
#seasonSub{font-size:12px;color:var(--ink-dim);text-shadow:0 1px 2px rgba(0,0,0,.5)}
button{font-family:var(--ui);font-size:13px;color:var(--ink);background:var(--shade);border:1px solid var(--chip);border-radius:999px;padding:6px 12px;cursor:pointer;backdrop-filter:blur(4px)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:rgba(190,80,120,.55)}
#found small{font-size:11px;color:var(--ink-dim)}
#soft{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(255,246,236,0) 55%,rgba(255,240,228,.26) 100%)}
#found{display:flex;flex-direction:column;line-height:1.4;font-size:12px;padding:4px 12px;border-radius:999px;background:var(--shade);border:1px solid var(--chip);cursor:help}
#hudR{flex-wrap:wrap;justify-content:flex-end;flex:1 1 auto;min-width:0;gap:6px}
@media (max-width:480px){#hudR button{font-size:12px;padding:5px 10px}}
#map{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));cursor:pointer;width:120px;height:120px;border-radius:50%;box-shadow:0 2px 10px rgba(40,20,30,.25);border:2px solid rgba(255,250,244,.7)}
@media (max-width:480px){#map{width:96px;height:96px}}
#bubble{position:absolute;left:0;top:0;font-size:14px;padding:6px 12px;border-radius:14px;background:#fffaf4;color:#6a4a52;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s;box-shadow:0 2px 6px rgba(60,30,40,.18)}
#bubble::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fffaf4}
#dInfo{margin:0;font-size:11px;line-height:1.5;color:var(--ink-dim);white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:16px;padding:8px 18px;border-radius:999px;background:rgba(255,250,244,.88);color:#6a4a52;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#title .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#cont{font-size:17px;padding:10px 28px}
#hudL{flex-direction:column;align-items:flex-start;gap:6px;flex:0 0 auto}
#hint{position:absolute;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:13px;color:var(--ink);background:var(--shade);padding:6px 14px;border-radius:999px;white-space:nowrap;transition:opacity 1.2s;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1s ease}
#card .k{font-size:clamp(64px,16vw,120px);line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.35)}
#card .s{font-size:14px;letter-spacing:.4em;margin-top:10px;color:var(--ink);text-shadow:0 1px 4px rgba(0,0,0,.5)}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-inline:16px;background:linear-gradient(180deg,rgba(20,16,26,.05),rgba(20,16,26,.45));transition:opacity .8s}
#title h1{margin:0;font-weight:500;font-size:clamp(34px,8vw,60px);letter-spacing:.12em;text-align:center;text-wrap:balance;text-shadow:0 2px 12px rgba(60,30,50,.5)}
#title p{margin:0;font-size:14px;color:var(--ink);text-shadow:0 1px 4px rgba(0,0,0,.6);text-align:center}
#start{font-size:17px;padding:10px 28px;background:rgba(246,196,210,.28);border-color:rgba(255,255,255,.4)}
#err{position:absolute;left:16px;right:104px;bottom:calc(150px + env(safe-area-inset-bottom,0px));font-size:11px;line-height:1.5;color:#7a2a2a;background:rgba(251,246,234,.92);border-radius:6px;padding:6px 10px;text-align:left;word-break:break-all;pointer-events:none}
@media (prefers-reduced-motion:reduce){#fade,#card,#title,#hint,#toast{transition:none}}
/* 表示は上にまとめる（アプリのヘッダーの下から）・上の帯はタッチを通す */
:root{padding-top:0!important;padding-bottom:0!important;--safeT:env(safe-area-inset-top,0px)}
#top{top:calc(8px + var(--safeT));pointer-events:none}
#top button{pointer-events:auto}
#map{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#hint{bottom:auto;top:calc(96px + var(--safeT));left:16px;right:16px;transform:none;white-space:normal;overflow:visible;text-overflow:clip;max-width:none;border-radius:12px;font-size:12px;line-height:1.5}
#toast{top:calc(150px + var(--safeT))}
/* カケラの手帳：紙のノート */
#book{position:absolute;inset:0;background:rgba(30,22,28,.45);display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--safeT)) 16px 16px}
#book[hidden]{display:none!important}
#book .paper{--paper:#fbf6ea;--ink2:#5a4a44;--rule:rgba(150,120,100,.14);background:var(--paper);color:var(--ink2);border-radius:16px;width:min(760px,100%);max-height:100%;overflow:auto;padding:16px 16px 20px;
  box-shadow:0 10px 30px rgba(40,20,30,.35);background-image:repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px)}
#book .bh{display:flex;justify-content:space-between;align-items:center;gap:12px}
#book h2{margin:0;font-weight:500;font-size:20px;letter-spacing:.1em}
#book button{color:var(--ink2);background:#efe5d2;border:1px solid rgba(120,90,70,.25);backdrop-filter:none}
#book .tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
#book .tabs button{display:flex;gap:6px;align-items:baseline;font-size:15px;padding:6px 14px}
#book .tabs button small{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
#book .tabs button[aria-pressed="true"]{background:#5a4a44;color:#fbf6ea}
#book .kc.self{grid-column:1/-1;max-width:320px;margin:0 auto}
#book .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
#book .kc{display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:10px;border-radius:12px;background:rgba(255,255,255,.6);border:1px solid rgba(120,90,70,.15);min-width:0}
#book .kc.no{background:transparent;border-style:dashed}
#book .pic{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:8px;overflow:hidden;background:#f2e8d4;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(120,90,70,.18)}
#book .pic img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto}
#book .pic>span{font-size:28px;color:rgba(90,74,68,.35)}
#book .pic>span.later{font-size:11px;line-height:1.5;text-align:center;color:rgba(90,74,68,.6)}
#book .kc.no .pic{background:transparent;border:2px dashed rgba(90,74,68,.25);box-shadow:none}
#book .pic .stamp{position:absolute;right:6px;bottom:6px;width:34px;height:34px;font-size:16px}
#book .stamp{flex:0 0 44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;background:var(--s,#ccc);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55);transform:rotate(-8deg)}
#book .kc.no .stamp-x{background:transparent;color:rgba(90,74,68,.45);border:2px dashed rgba(90,74,68,.3);box-shadow:none;transform:none}
#book .kb{min-width:0;display:flex;flex-direction:column;gap:3px}
#book .kb b{font-weight:500;font-size:15px}
#book .kb p{margin:0;font-size:12px;line-height:1.5}
#book .kb small{font-size:11px;opacity:.6}
#book .cat{align-self:flex-start;font-size:10px;padding:1px 8px;border-radius:999px;color:#fff;background:var(--c)}
#book .locked{grid-column:1/-1;margin:24px 0;text-align:center;line-height:1.8;font-size:14px}
/* ===== 観察手帳のUI：紙もの ===== */
#stage{--acc:#8a6e4a;--paper:#fbf6ea;--paper2:#f3ead6;--pink:#5a4a44;--inkd:rgba(90,74,68,.7);--hand:"Klee One","Kiwi Maru",serif}
/* 紙のタグ型ボタン：穴・ステッチ・押すと沈む */
#top button,#title button,#bookClose{position:relative;font-family:var(--ui);font-size:13px;color:var(--pink);background:var(--paper);border:1px solid rgba(90,70,60,.3);border-radius:5px 9px 9px 5px;
  padding:6px 12px 6px 20px;box-shadow:0 2px 0 rgba(90,70,60,.22),0 4px 10px rgba(40,25,20,.18);backdrop-filter:none;transform:rotate(var(--rot,0deg));transition:transform .08s,box-shadow .08s}
#top button::before,#title button::before,#bookClose::before{content:'';position:absolute;left:7px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--paper2);box-shadow:inset 0 1px 1px rgba(60,40,30,.45)}
#top button::after,#title button::after,#bookClose::after{content:'';position:absolute;inset:3px 3px 3px 15px;border:1px dashed rgba(90,70,60,.22);border-radius:3px 6px 6px 3px;pointer-events:none}
#top button:active,#title button:active,#bookClose:active{transform:translateY(2px) rotate(var(--rot,0deg));box-shadow:0 0 0 rgba(90,70,60,.22),0 1px 4px rgba(40,25,20,.18)}
#top button:focus-visible,#title button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
#bookBtn{--rot:-2deg}#snd{--rot:1.5deg}
#snd[aria-pressed="true"]{color:var(--acc);background:var(--paper)}
#snd[aria-pressed="true"]::before{background:var(--acc);box-shadow:none}
/* 季節の紙片：角を折った手帳の切れはし */
#hudL{filter:none}
#top>#hudL{}
#top{filter:drop-shadow(0 3px 5px rgba(40,25,20,.18))}
#hudL{background:var(--paper);color:var(--pink);padding:8px 16px 9px 14px;border-radius:3px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);position:relative;border-top:4px solid var(--acc);gap:4px;pointer-events:none}
#hudL::after{content:'';position:absolute;right:0;top:0;width:14px;height:14px;background:linear-gradient(225deg,transparent 50%,#e6dac2 50%);box-shadow:-1px 1px 2px rgba(0,0,0,.08)}
#season{color:var(--pink);text-shadow:none;font-size:22px;letter-spacing:.06em}
#seasonSub{color:var(--inkd);text-shadow:none;font-family:var(--hand)}
#found{background:none;border:none;padding:0;color:var(--pink);font-size:12px;gap:3px}
#found .cnt{font-variant-numeric:tabular-nums}
#found small{color:var(--inkd);font-family:var(--hand);font-size:11px}
#found .pips{display:flex;gap:3px}
#found .pips i{width:8px;height:8px;border-radius:50%;border:1px solid var(--acc);display:block;opacity:.75}
#found .pips i.on{background:var(--acc);opacity:1}
#found .pips i.gate{margin-right:4px}
/* 手描き地図 */
#map{border:3px double rgba(90,70,60,.55);box-shadow:0 3px 10px rgba(40,25,20,.25);background:var(--paper2)}
/* 吹き出し：鉛筆の線 */
#bubble{font-family:var(--ui);font-weight:500;background:var(--paper);color:var(--pink);border:1.5px solid rgba(90,70,60,.75);border-radius:16px 14px 18px 12px;box-shadow:2px 3px 0 rgba(90,70,60,.15)}
#bubble::after{bottom:-7px;border-top-color:rgba(90,70,60,.75)}
/* お知らせ：マステで貼った付箋 */
#toast{font-family:var(--hand);font-weight:600;background:#fff4c4;color:var(--pink);border-radius:2px;padding:10px 20px 9px;transform:translateX(-50%) rotate(-1.5deg);box-shadow:0 4px 10px rgba(40,25,20,.2)}
#toast::before{content:'';position:absolute;left:50%;top:-8px;width:56px;height:16px;margin-left:-28px;background:color-mix(in srgb,var(--acc) 45%,transparent);transform:rotate(2deg)}
/* 操作の説明：紙片 */
#hint{font-family:var(--hand);background:rgba(251,246,234,.92);color:var(--pink);border-radius:4px;box-shadow:0 2px 8px rgba(40,25,20,.15);border-left:4px solid var(--acc)}
/* 季節に入ったときのはんこ */
#card .k{width:clamp(130px,32vw,190px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:5px solid var(--acc);border-radius:50%;color:var(--acc);
  background:rgba(251,246,234,.82);text-shadow:none;font-size:clamp(64px,16vw,104px);transform:rotate(-8deg);box-shadow:inset 0 0 0 4px rgba(251,246,234,.8),inset 0 0 0 6px var(--acc)}
#card .k.long{width:auto;aspect-ratio:auto;border-radius:999px;padding:10px 28px;font-size:clamp(32px,8vw,52px)}
#card .s{color:var(--pink);text-shadow:none;font-family:var(--hand);font-weight:600;background:var(--paper);padding:3px 14px;border-radius:3px;margin-top:14px;box-shadow:0 2px 6px rgba(40,25,20,.2)}
/* タイトル：表紙 */
#title{background:linear-gradient(180deg,rgba(40,28,24,.05),rgba(40,28,24,.35))}
#title .tcard{background:var(--paper);color:var(--pink);padding:26px 28px 24px;border-radius:6px;box-shadow:0 10px 30px rgba(40,20,20,.3);display:flex;flex-direction:column;align-items:center;gap:14px;
  max-width:min(420px,calc(100% - 32px));border-top:6px solid var(--acc);background-image:repeating-linear-gradient(180deg,transparent 0 27px,rgba(150,120,100,.12) 27px 28px)}
#title h1{color:var(--pink);text-shadow:none;font-size:clamp(30px,8vw,46px)}
#title p{color:var(--inkd);text-shadow:none;font-family:var(--hand);font-weight:600}
#title button{font-size:16px;padding:9px 18px 9px 26px}
#start{--rot:-1.5deg}#cont{--rot:1.5deg}
#book .tabs button[aria-pressed="true"]{background:var(--acc)}
#lookBtn{position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;width:72px;height:72px;padding:0;
  border-radius:50%;font-family:var(--ui);font-size:12px;color:var(--pink);background:var(--paper);border:1px solid rgba(90,70,60,.3);box-shadow:0 3px 0 rgba(90,70,60,.22),0 5px 12px rgba(40,25,20,.22);transform:rotate(-3deg);transition:transform .08s,box-shadow .08s}
#lookBtn::after{content:'';position:absolute;inset:4px;border:1px dashed rgba(90,70,60,.25);border-radius:50%;pointer-events:none}
#lookBtn .ar{font-size:22px;line-height:1;color:var(--acc)}
#lookBtn:active{transform:translateY(2px) rotate(-3deg);box-shadow:0 0 0 rgba(90,70,60,.22),0 2px 5px rgba(40,25,20,.2)}
#lookBtn[aria-pressed="true"]{background:var(--acc);color:var(--paper)}
#lookBtn[aria-pressed="true"] .ar{color:var(--paper)}
#lookBtn:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
/* 右上のボタンはいつも同じ場所に縦一列 */
#top{z-index:6}
#hudR{flex-direction:column;align-items:flex-end;flex:0 0 auto;flex-wrap:nowrap;gap:8px;max-width:none}
#hudL{flex:0 1 auto;max-width:calc(100% - 128px);min-width:0}
#hudL>.hud{flex-wrap:wrap;row-gap:0}
#book{z-index:20}
</style>
</head>
<body>


<div id="stage">
  <canvas id="c"></canvas>
  <div id="soft"></div>
  <div id="fade"></div>
  <div id="top">
    <div class="hud" id="hudL"><div class="hud"><span id="season">春</span><span id="seasonSub">はる</span></div><span id="found">カケラ 0/10</span></div>
    <div class="hud" id="hudR">
      <button id="bookBtn">手帳</button>
      <button id="snd" aria-pressed="false">音 OFF</button>
    </div>
  </div>
  <div id="card"><div class="k">春</div><div class="s">はる</div></div>
  <div id="hint">気になるところをタッチすると、うーちーが行く…かも ・ ドラッグで見回す ・ ホイールでズーム</div>
  <canvas id="map" width="240" height="240" aria-label="ミニマップ"></canvas>
  <button id="lookBtn" aria-pressed="false"><span class="ar">↑</span>見上げる</button>
  <div id="toast"></div>
  <div id="bubble" aria-live="polite"></div>
  <div id="title">
    <div class="tcard">
      <h1>うーちーの季節</h1>
      <p>うーちーの散歩を、そっと見守ろう</p>
      <div class="row"><button id="start">さんぽにでかける</button><button id="cont" hidden>つづきから</button></div>
    </div>
  </div>
  <div id="book" hidden>
    <div class="paper" role="dialog" aria-label="カケラの手帳">
      <div class="bh"><h2>カケラの手帳</h2><button id="bookClose">とじる</button></div>
      <div class="tabs" id="bookTabs"></div>
      <div class="grid" id="bookGrid"></div>
    </div>
  </div>
  <div id="err" hidden></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';

  const a=hash(xi,zi),b=hash(xi+1,zi),c=hash(xi,zi+1),d=hash(xi+1,zi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}

const ORDER=[1,2,3,0];
const nextOf=i=>ORDER[(ORDER.indexOf(i)+1)%4],prevOf=i=>ORDER[(ORDER.indexOf(i)+3)%4];
// tunnel layout: d = outward direction (x,z), to = area index
function tunnelsFor(i){return i===TERMINAL?[{d:[0,-1],to:ORDER[0]},{d:[1,0],to:ORDER[1]},{d:[0,1],to:ORDER[2]},{d:[-1,0],to:ORDER[3]}]
  :[{d:[0,-1],to:nextOf(i)},{d:[0,1],to:prevOf(i)},{d:[1,0],to:TERMINAL}];}
let TUN=tunnelsFor(TERMINAL);
const tAl=(tu,x,z)=>x*tu.d[0]+z*tu.d[1], tAc=(tu,x,z)=>x*tu.d[1]-z*tu.d[0];
function nearTunnel(x,z,al0,ac0=6){for(const tu of TUN)if(Math.abs(tAc(tu,x,z))<ac0&&tAl(tu,x,z)>al0)return true;return false;}

let FLATS=[];
function heightAt(x,z){
  const r=Math.hypot(x,z);
  let h=(Math.sin(x*.09)*.9+Math.cos(z*.075)*.8+Math.sin((x+z)*.16)*.35+(vnoise(x*.12+40,z*.12)-.5)*1.6)*smooth(3,14,r);
  h+=smooth(42,62,r)*13;
  let c=0;for(const tu of TUN)c=Math.max(c,(1-smooth(3,7,Math.abs(tAc(tu,x,z))))*smooth(30,40,tAl(tu,x,z)));
  h*=1-c;
  if(STREAM)h-=(1-smooth(.7,2.2,streamDist(x,z)))*.45;
  for(const f of FLATS){const d=Math.hypot(x-f.x,z-f.z);h=lerp(h,f.h,1-smooth(f.r,f.r+3,d));}
  return h;
}

  for(let i=0;i<5;i++)b.push([(i-2)*3.6+(R()-.5),y+.5,R()*2,2.5+R()]);return b;}
function ridge(R,o){const N=110,rad=o.rad||84,pos=[],cs=[],idx=[],cb=col(o.bot),ctp=col(o.top),cap=o.cap?col(o.cap):null,cc=new THREE.Color();
  for(let i=0;i<=N;i++){const a=i/N*Math.PI*2;let h=o.hmin+(o.hmax-o.hmin)*clamp(.5+.35*Math.sin(a*o.freq+o.ph)+.45*(vnoise(a*o.n1+3,o.ph)-.5)*2,0,1);
    const x=Math.sin(a)*rad,z=Math.cos(a)*rad;pos.push(x,o.base,z,x,h,z);cs.push(cb.r,cb.g,cb.b);
    cc.copy(cb).lerp(ctp,.85);if(cap&&h>o.capH)cc.lerp(cap,clamp((h-o.capH)/3,0,1));if(o.patch&&R()<o.patch)cc.lerp(col(o.patchCol),.6);cs.push(cc.r,cc.g,cc.b);
    if(i){const q=(i-1)*2;idx.push(q,q+2,q+1,q+1,q+2,q+3);}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(cs,3));g.setIndex(idx);
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,fog:false,depthWrite:false,side:THREE.DoubleSide}));m.renderOrder=-.95;return m;}
function glowSprite(inner,outer,size,op=1){const s=new THREE.Sprite(new THREE.SpriteMaterial({fog:false,depthWrite:false,transparent:true,opacity:op,map:canvasTex(64,64,(c)=>{const g=c.createRadialGradient(32,32,0,32,32,32);

const A={ctx:null,on:false,master:null,wind:null,windF:null,extra:[],noise:null,kind:null};
function audioInit(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();A.ctx=ctx;A.master=ctx.createGain();A.master.gain.value=.0;A.master.connect(ctx.destination);
  const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=w*.5+last*3;}A.noise=b;
  const src=ctx.createBufferSource();src.buffer=b;src.loop=true;A.windF=ctx.createBiquadFilter();A.windF.type='lowpass';A.windF.frequency.value=380;
  A.wind=ctx.createGain();A.wind.gain.value=.05;const lfo=ctx.createOscillator();lfo.frequency.value=.09;const lg=ctx.createGain();lg.gain.value=.03;lfo.connect(lg).connect(A.wind.gain);lfo.start();
  src.connect(A.windF).connect(A.wind).connect(A.master);src.start();
  setInterval(audioTick,220);
}
function audioSeason(key){if(!A.ctx)return;A.kind=key;A.extra.forEach(n=>{try{n.stop()}catch(e){}});A.extra=[];const ctx=A.ctx;
  A.windF.frequency.setTargetAtTime(key==='winter'?620:key==='autumn'?420:340,ctx.currentTime,.5);
  A.wind.gain.setTargetAtTime(key==='winter'?.11:.05,ctx.currentTime,.5);
  if(key==='summer'){const s=ctx.createBufferSource();s.buffer=A.noise;s.loop=true;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=5200;bp.Q.value=9;
    const g=ctx.createGain();g.gain.value=.05;const l=ctx.createOscillator();l.type='square';l.frequency.value=14;const lg=ctx.createGain();lg.gain.value=.03;l.connect(lg).connect(g.gain);l.start();
    const swell=ctx.createGain();swell.gain.value=.7;const l2=ctx.createOscillator();l2.frequency.value=.12;const l2g=ctx.createGain();l2g.gain.value=.5;l2.connect(l2g).connect(swell.gain);l2.start();
    s.connect(bp).connect(g).connect(swell).connect(A.master);s.start();A.extra.push(s,l,l2);}
}
function blip(f0,f1,dur,vol,type='sine',when=0){const ctx=A.ctx,t=ctx.currentTime+when;const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(A.master);o.start(t);o.stop(t+dur+.02);}
function audioTick(){if(!A.on||document.hidden)return;
  if((A.kind==='spring'||A.kind==='terminal')&&Math.random()<(A.kind==='spring'?.12:.06)){const f=2400+Math.random()*1200,n=2+(Math.random()*3|0);for(let i=0;i<n;i++)blip(f,f*1.45,.09,.05,'sine',i*.13);}
  if(A.kind==='autumn'){A.cr=(A.cr||0)+1;
    // コオロギ：同じ高さで「ころろ」と3つずつ、一定のリズムで
    if(A.cr%2===0)for(let i=0;i<3;i++)blip(4650,4650,.03,.022,'sine',i*.055);
    // 遠くの虫：少し高い音で、細かいトリルをたまに（音の高さは変えない）
    if(A.cr%7===3)for(let i=0;i<8;i++)blip(5350,5350,.02,.009,'sine',i*.035);}
  if(A.kind==='summer'&&Math.random()<.04){blip(1800,2600,.12,.03,'sine');}
}
function stepSound(){if(!A.on)return;const f=560+Math.random()*90;blip(f,f*.7,.07,.08,'triangle');
  if(A.kind==='winter'){const ctx=A.ctx,s=ctx.createBufferSource();s.buffer=A.noise;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=1.5;
    const g=ctx.createGain();const t=ctx.currentTime;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);s.connect(bp).connect(g).connect(A.master);s.start(t,Math.random());s.stop(t+.14);}}

function makeButterfly(c1,c2){const g=new THREE.Group();const m=new THREE.MeshBasicMaterial({map:wingTex(c1,c2),alphaTest:.4,side:THREE.DoubleSide});
  const geo=new THREE.PlaneGeometry(.3,.3);geo.translate(.15,0,0);geo.rotateX(-Math.PI/2);
  const wr=new THREE.Mesh(geo,m),wl=new THREE.Mesh(geo,m);wl.scale.x=-1;
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.016,.016,.2,4),lam(0x3a3030));body.rotation.x=Math.PI/2;g.add(wr,wl,body);
  return {g,flap:(tt,c)=>{const a=Math.sin(tt*(c.hover>0?6:16))*.95;wr.rotation.z=a;wl.rotation.z=-a;}};}
function makeDragonfly(){const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(.035,.035,.42),lam(0xd8402a));body.position.z=-.08;
  const head=new THREE.Mesh(new THREE.SphereGeometry(.045,6,4),lam(0x8a3020));head.position.z=.15;
  const wm=new THREE.MeshBasicMaterial({color:0xf4f8ff,transparent:true,opacity:.55,side:THREE.DoubleSide,depthWrite:false});
  const wg=new THREE.PlaneGeometry(.46,.07);wg.rotateX(-Math.PI/2);const w1=new THREE.Mesh(wg,wm),w2=new THREE.Mesh(wg,wm);w1.position.set(0,.02,.07);w2.position.set(0,.02,.0);
  g.add(body,head,w1,w2);return {g,flap:(tt)=>{w1.rotation.z=Math.sin(tt*40)*.25;w2.rotation.z=-Math.sin(tt*40+1)*.25;}};}
function makeCicada(){const g=new THREE.Group();const b=new THREE.Mesh(smoothGeo(new THREE.SphereGeometry(.07,6,5)),lam(0x4a3626));b.scale.set(1,1.6,.8);

function addCritter(kind,maker,speed){const R=Math.random;let x,z;do{const a=R()*6.28,r=8+R()*30;x=Math.cos(a)*r;z=Math.sin(a)*r;}while(!okSpot(x,z));
  const m=maker();const c={kind,critter:true,g:m.g,flap:m.flap,speed,pos:new THREE.Vector3(x,heightAt(x,z)+1.2,z),vel:new THREE.Vector3(),
    target:new THREE.Vector3(x,heightAt(x,z)+1.2,z),retarget:0,hover:0,boost:0,seed:R()*10,cool:0,near:1.2};
  c.flee=()=>{const d=c.pos.clone().sub(holder.position);d.y=0;d.normalize();c.target.copy(c.pos).addScaledVector(d,4);c.target.y=heightAt(c.target.x,c.target.z)+1.8+Math.random();c.boost=1.6;c.retarget=3;c.hover=0;};

function populateLife(S,trees){
  critters=[];pois=[];
  const R=Math.random;
  if(S.key==='spring'){for(let i=0;i<4;i++)addCritter('butterfly',()=>makeButterfly('#ffe25a','#e0a020'),1.1);}
  if(S.key==='summer'){addPoi('sunflower',16,heightAt(16,-14)+1.5,-14,3.2);}

  if(S.plaza){for(let i=0;i<4;i++)addCritter('butterfly',()=>makeButterfly('#fbfaf2','#d8d0b0'),.9);}
  if(S.key==='winter'){addPoi('snowman',5,heightAt(5,-9)+1.5,-9,1.9);}
  trees.forEach((tr,i)=>{if(!['round','pine','bare'].includes(tr.type)||i%2)return;pois.push({kind:'tree',pos:new THREE.Vector3(tr.x,heightAt(tr.x,tr.z)+2.5,tr.z),near:1.5,cool:0});});
  for(const be of benches)pois.push({kind:'bench',bench:be,pos:new THREE.Vector3(be.x,.7,be.z),near:1.6,cool:0});
  if(seasonTreePoi)pois.push(seasonTreePoi);
  if(S.pond){const f=FLATS[0];addPoi(S.pond==='ice'?'ice':'pond',f.x,f.h+.3,f.z,f.r+1.4);}
  updateFound();
}

function updateLife(dt){
  for(const c of critters){
    c.retarget-=dt;c.boost=Math.max(0,c.boost-dt);
    const toT=c.target.distanceTo(c.pos);
    if(c.retarget<=0||toT<.4){
      if(c.kind==='dragonfly'&&c.hover<=0&&toT<.4)c.hover=.8+Math.random()*1.8;
      const far=Math.hypot(c.pos.x-player.x,c.pos.z-player.z)>20;
      const bx=far?player.x:c.pos.x,bz=far?player.z:c.pos.z,sp=far?7:5;
      let x=bx+(Math.random()-.5)*2*sp,z=bz+(Math.random()-.5)*2*sp;const r=Math.hypot(x,z);if(r>40){x*=40/r;z*=40/r;}
      c.target.set(x,heightAt(x,z)+.6+Math.random()*1.5,z);c.retarget=3+Math.random()*3;}
    if(c.hover>0){c.hover-=dt;c.vel.multiplyScalar(Math.exp(-dt*6));}
    else{tmp.copy(c.target).sub(c.pos).normalize().multiplyScalar(c.speed*(1+c.boost));c.vel.lerp(tmp,1-Math.exp(-dt*(c.kind==='dragonfly'?4:1.8)));}
    c.pos.addScaledVector(c.vel,dt);const gy=heightAt(c.pos.x,c.pos.z);if(c.pos.y<gy+.35)c.pos.y=gy+.35;
    c.g.position.copy(c.pos);c.g.position.y+=c.kind==='butterfly'?Math.sin(t*4+c.seed)*.12:Math.sin(t*2+c.seed)*.03;
    if(c.vel.lengthSq()>.01)c.g.rotation.y+=angDiff(Math.atan2(c.vel.x,c.vel.z),c.g.rotation.y)*(1-Math.exp(-dt*5));
    c.flap(t+c.seed,c);}
  // emote bubble
  if(emoteT>0){emoteT-=dt;const k=emoteDur-emoteT,pop=k<.18?k/.18*1.15:Math.max(1,1.15-(k-.18)*1.5);
    emote.visible=true;emote.scale.setScalar(.55*pop);emote.material.opacity=clamp(emoteT/.3,0,1);
    emote.position.set(player.x,holder.position.y+1.95+(P.root?P.root.position.y:0),player.z);}else emote.visible=false;
}
function interestsNear(maxD){const out=[];
  for(const c of critters){const d=Math.hypot(c.pos.x-player.x,c.pos.z-player.z);if(d<maxD)out.push({o:c,d});}
  for(const p of pois){const d=Math.hypot(p.pos.x-player.x,p.pos.z-player.z);if(d<maxD)out.push({o:p,d});}
  return out.sort((a,b)=>a.d-b.d);}
function nearestLook(maxD){let best=null,bd=maxD;
  for(const c of critters){const d=Math.hypot(c.pos.x-player.x,c.pos.z-player.z);if(d<bd){bd=d;best=c.pos;}}return best;}

let STREAM=null,streamWater=null;
function streamDist(x,z){let best=1e9;for(let i=0;i<STREAM.length-1;i++){const a=STREAM[i],b=STREAM[i+1],abx=b[0]-a[0],abz=b[1]-a[1];
  const tt=clamp(((x-a[0])*abx+(z-a[1])*abz)/(abx*abx+abz*abz),0,1);const d=Math.hypot(x-a[0]-abx*tt,z-a[1]-abz*tt);if(d<best)best=d;}return best;}
function streamAt(u){const n=STREAM.length-1,f=clamp(u,0,1)*n,i=Math.min(n-1,Math.floor(f)),tt=f-i,a=STREAM[i],b=STREAM[i+1];
  return {x:lerp(a[0],b[0],tt),z:lerp(a[1],b[1],tt),dx:b[0]-a[0],dz:b[1]-a[1]};}
function buildStream(){const pos=[],uv=[],idx=[];let dist=0,prev=null,row=0;
  for(let s=0;s<=120;s++){const p=streamAt(s/120);const L=Math.hypot(p.dx,p.dz),nx=-p.dz/L,nz=p.dx/L;if(prev)dist+=Math.hypot(p.x-prev.x,p.z-prev.z);prev=p;
    const y=heightAt(p.x,p.z)+.24;for(const sd of[-1,1]){pos.push(p.x+nx*.95*sd,y,p.z+nz*.95*sd);uv.push(sd<0?0:1,dist/3);}
    if(s){const a=(row-1)*2,b=row*2;idx.push(a,b,a+1,a+1,b,b+1);}row++;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);
  const wt=SPR.water.clone();wt.needsUpdate=true;wt.repeat.set(1,1);
  streamWater=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x6cc4e4,map:wt,transparent:true,opacity:.85,side:THREE.DoubleSide,depthWrite:false}));world.add(streamWater);}

function placeKakera(S,trees){kakera=[];if(S.plaza)return;
  if(S.key==='summer'){placeSummer(S,trees);return;}
  if(S.key==='autumn'){placeAutumn(S,trees);return;}
  if(S.key==='winter'){placeWinter(S,trees);return;}
  if(S.key==='spring'){placeSpring(S,trees);return;}
  const R=rng(4242+SEASONS.indexOf(S)*97),spots=[];let guard=0;
  while(spots.length<10&&guard++<4000){const a=R()*6.283,r=6+R()*36,x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(!okSpot(x,z)||spots.some(s=>Math.hypot(s.x-x,s.z-z)<8)||colliders.some(c=>Math.hypot(c.x-x,c.z-z)<c.r+1))continue;spots.push({x,z});}
  spots.forEach((p,i)=>{const g=new THREE.Group();const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.18,0),new THREE.MeshBasicMaterial({color:K_COL[S.key]}));gem.scale.y=1.45;g.add(gem);
    const y=heightAt(p.x,p.z)+.42;g.position.set(p.x,y,p.z);world.add(g);
    const k=addK(S,i,{g,gem,placeholder:true,hideOnGet:true,pos:new THREE.Vector3(p.x,y,p.z)});if(k.got)g.visible=false;});}
function updateKakera(dt){for(const k of kakera){if(k.upd)k.upd(dt,k);
  if(k.gem&&!k.got){k.gem.rotation.y=t*1.5+k.seed;k.g.position.y=k.pos.y+Math.sin(t*2+k.seed)*.08;}
  if(k.got){if(k.fly>0){k.fly-=dt;const f=1-Math.max(0,k.fly)/.8;k.glow.position.lerpVectors(k.flyFrom,tmp.set(player.x,holder.position.y+1.4,player.z),f);
      k.glow.material.opacity=.95;k.glow.scale.setScalar(.9*(1-f*.6));if(k.fly<=0){k.glow.visible=false;if(k.hideOnGet&&k.g)k.g.visible=false;}}continue;}
  // きらめき：ふつうは数秒おき、見つけにくいものはまれに
  const per=k.hidden?(k.glint?4.5:9):3.2,ph=((t+k.seed*3)%per)/per;
  k.glow.position.copy(k.pos);k.glow.position.y+=k.placeholder?0:.15;
  k.glow.material.opacity=k.placeholder?.45+.2*Math.sin(t*3+k.seed):(ph<.18?Math.sin(ph/.18*Math.PI)*(k.hidden?.9:.75):0);
  k.glow.scale.setScalar(k.placeholder?.95:.6+ph*1.5);
  if(Math.hypot(k.pos.x-player.x,k.pos.z-player.z)<k.near)collectK(k);}}

function illustrate(buf,W,H){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),img=g.createImageData(W,H),d=img.data,L=new Float32Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const s=((H-1-y)*W+x)*4;L[y*W+x]=buf[s]*.3+buf[s+1]*.59+buf[s+2]*.11;}
  const P=[246,238,220],INK=[90,70,62];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const s=((H-1-y)*W+x)*4,o=(y*W+x)*4;
    const l=(xx,yy)=>L[Math.min(H-1,Math.max(0,yy))*W+Math.min(W-1,Math.max(0,xx))];
    const gx=l(x+1,y-1)+2*l(x+1,y)+l(x+1,y+1)-l(x-1,y-1)-2*l(x-1,y)-l(x-1,y+1),gy=l(x-1,y+1)+2*l(x,y+1)+l(x+1,y+1)-l(x-1,y-1)-2*l(x,y-1)-l(x+1,y-1);
    const e=Math.min(1,Math.max(0,(Math.hypot(gx,gy)-40)/160))*.7,grain=((x*7+y*13)%5)/5*.04;
    for(let ch=0;ch<3;ch++){let v=buf[s+ch];v=v*.55+Math.round(v/255*5)/5*255*.45;v=v*.82+P[ch]*.18-grain*40;v=v*(1-e)+INK[ch]*e;d[o+ch]=Math.max(0,Math.min(255,v));}d[o+3]=255;}
  g.putImageData(img,0,0);const vg=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.62);vg.addColorStop(0,'rgba(246,238,220,0)');vg.addColorStop(1,'rgba(246,238,220,.85)');g.fillStyle=vg;g.fillRect(0,0,W,H);
  return c.toDataURL('image/jpeg',.82);}

function animate(dt){

  img.src='data:image/png;base64,'+TEX_B64;});}
async function start(data){

  }catch(e){$('err').hidden=false;$('err').textContent='うーちーのモデルを読み込めませんでした: '+e.message;}

  if(!A.ctx){try{audioInit();audioSeason(SEASONS[si].key);A.on=true;A.master.gain.setTargetAtTime(.9,A.ctx.currentTime,.3);$('snd').textContent='音 ON';$('snd').setAttribute('aria-pressed','true');}catch(e){}}
